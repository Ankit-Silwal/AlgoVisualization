services:
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      RUNNER_ENABLED: "true"
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      TRUST_PROXY: "true"
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
